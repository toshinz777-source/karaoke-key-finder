<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Tooth Check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- Quiz top bar (back button + progress) -->
    <header id="quiz-topbar" class="quiz-topbar hidden">
      <button id="btn-back" class="icon-btn" aria-label="Back">&larr;</button>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <span id="step-label" class="step-label"></span>
    </header>

    <main id="screens">

      <!-- HOME -->
      <section id="screen-home" class="screen">
        <div class="home-hero">
          <div class="tooth-logo">🦷</div>
          <h1>Tooth Check</h1>
          <p class="subtitle">Check your dental symptoms and see how soon you may need a dentist.</p>
          <button id="btn-start-check" class="btn-primary btn-huge">Start Check</button>
        </div>
        <p class="disclaimer">This app does not diagnose dental conditions and is not a substitute for a dentist or doctor.</p>
      </section>

      <!-- QUIZ -->
      <section id="screen-quiz" class="screen hidden">
        <div id="question-container" class="question-container"></div>
      </section>

      <!-- RESULT -->
      <section id="screen-result" class="screen hidden">
        <div id="result-content" class="result-content"></div>
      </section>

      <!-- HISTORY -->
      <section id="screen-history" class="screen hidden">
        <h1 class="screen-title">History</h1>
        <div id="trend-warning" class="trend-warning hidden"></div>
        <div id="history-list" class="history-list"></div>
      </section>

      <!-- SUMMARY -->
      <section id="screen-summary" class="screen hidden">
        <h1 class="screen-title">Dentist Summary</h1>
        <div id="summary-content" class="summary-content"></div>
      </section>

    </main>

    <nav class="bottom-nav">
      <button class="nav-btn" data-nav="home">
        <span class="nav-icon">🏠</span><span>Home</span>
      </button>
      <button class="nav-btn" data-nav="quiz">
        <span class="nav-icon">🩺</span><span>Check</span>
      </button>
      <button class="nav-btn" data-nav="history">
        <span class="nav-icon">📋</span><span>History</span>
      </button>
      <button class="nav-btn" data-nav="summary">
        <span class="nav-icon">📝</span><span>Summary</span>
      </button>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
